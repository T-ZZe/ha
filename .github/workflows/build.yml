name: Build plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: HardcorePlus/pom.xml
      - name: Build
        working-directory: HardcorePlus
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: HardcorePlus
          path: HardcorePlus/target/HardcorePlus.jar
      - name: Release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HardcorePlus/target/HardcorePlus.jar
