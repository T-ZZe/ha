name: Build plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Trouver le pom.xml
        id: find
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -n 1)
          if [ -z "$POM" ]; then
            echo "Aucun pom.xml trouvé. Contenu du repo :"
            find . -not -path "./.git/*" | head -100
            exit 1
          fi
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"
          echo "pom.xml trouvé dans : $(dirname "$POM")"

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: HardcorePlus
          path: ${{ steps.find.outputs.dir }}/target/HardcorePlus.jar
          
